[package]
name = "cylinders-intersection"
version = "0.1.0"
edition = "2021"
description = "Compute the developed (gueule de loup) patterns from cylinder–cylinder and cylinder–plane intersections, packaged as a Tauri desktop app."
license = "MIT"

[lib]
name = "cylinders_intersection_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
