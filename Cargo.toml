[package]
name = "cylix"
version = "0.2.0"
edition = "2021"
description = "Cylix — exact cylinder-intersection cut templates (gueule de loup) developed at scale 1:1, exposed via an Axum HTTP API with vector PDF/DXF export."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
